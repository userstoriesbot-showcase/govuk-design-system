# Showcase fork only (never part of an upstream pull request).
# Dogfood (first-try start track, ADR-0268): ALLOW_EXTERNAL_CONNECTIONS is left out on purpose, so browser-sync
# listens on localhost only and the run must adopt the loopback port.
version: 1
app:
  install: "PUPPETEER_SKIP_DOWNLOAD=true npm ci"
  start: "PORT={port} npm start"
  url: http://localhost:{port}
  readyPath: /cookies/
  runtime: node24
demo:
  maxVideos: 1
  beforePass: true
